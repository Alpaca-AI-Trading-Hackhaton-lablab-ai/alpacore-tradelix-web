server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	# Docker DNS so nginx starts even if tradelix-backend is not up yet.
	resolver 127.0.0.11 ipv6=off valid=10s;

	# The Vite bundle ships as one ~580 KB chunk; gzip takes it to ~180 KB.
	# text/event-stream is deliberately absent: SSE must flush per event, and
	# buffering it to fill a compression window would stall the node updates.
	gzip on;
	gzip_comp_level 6;
	gzip_min_length 1024;
	gzip_vary on;
	gzip_types text/plain text/css application/javascript application/json image/svg+xml;

	location /api/ {
		set $upstream "${API_UPSTREAM}";
		# Variable proxy_pass does not strip /api/; rewrite so /api/bars → /bars.
		rewrite ^/api/(.*)$ /$1 break;
		proxy_pass http://$upstream;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Connection "";
		proxy_buffering off;
		proxy_cache off;
		proxy_read_timeout 3600s;
		chunked_transfer_encoding off;
	}

	# Vite fingerprints these filenames, so a changed build is a changed URL:
	# safe to cache forever. index.html must never be cached or the browser
	# keeps resolving the old hashes after a deploy.
	location /assets/ {
		# One directive only: `expires` also emits Cache-Control, so pairing it
		# with add_header sends the header twice.
		add_header Cache-Control "public, max-age=31536000, immutable";
	}

	location / {
		add_header Cache-Control "no-cache";
		try_files $uri $uri/ /index.html;
	}
}
